<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <!-- Square Container matching Image 4 -->
  <rect x="25" y="25" width="250" height="250" rx="8" fill="#e11d48" opacity="0.9" />
  
  <!-- Nested Geometric Tiles Icon -->
  <g transform="translate(150, 95)" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer diamond / rotated square -->
    <rect x="-38" y="-38" width="76" height="76" rx="4" transform="rotate(14)" stroke-opacity="0.95" />
    <!-- Straight inner square -->
    <rect x="-30" y="-30" width="60" height="60" rx="2" stroke-width="3.5" stroke-opacity="0.95" />
    <!-- Center core small square -->
    <rect x="-14" y="-14" width="28" height="28" stroke-width="3" stroke-opacity="0.95" />
    <!-- Subtle crosshair notches -->
    <line x1="-30" y1="0" x2="-14" y2="0" stroke-width="3" />
    <line x1="14" y1="0" x2="30" y2="0" stroke-width="3" />
    <line x1="0" y1="-30" x2="0" y2="-14" stroke-width="3" />
    <line x1="0" y1="14" x2="0" y2="30" stroke-width="3" />
  </g>

  <!-- "Fresh" Brand Name in Flowing Script matching Image 4 -->
  <g fill="#ffffff">
    <text x="150" y="195" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive, sans-serif" font-size="56" font-weight="bold" font-style="italic" letter-spacing="1">
      Fresh
    </text>
  </g>

  <!-- "C E R A M I C S" Subtitle matching Image 4 -->
  <g fill="#ffffff">
    <text x="150" y="228" text-anchor="middle" font-family="'Valley Sans', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="8" opacity="0.95">
      CERAMICS
    </text>
  </g>
</svg>